# Mosquitto MQTT Broker Configuration for CivicTwin-R
#
# Local development configuration.
# For production, add authentication (password_file), TLS, and ACLs.

# ── Listener ─────────────────────────────────────────────
listener 1883 0.0.0.0

# ── Protocol ─────────────────────────────────────────────
protocol mqtt

# ── Logging ──────────────────────────────────────────────
log_type error
log_type warning
log_type notice
log_type information

# ── Persistence ──────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Security (local development only) ────────────────────
# WARNING: allow_anonymous true is for local development ONLY.
# For any networked deployment, set this to false and configure
# a password_file or authentication plugin.
allow_anonymous true

# ── Message limits ───────────────────────────────────────
max_packet_size 65536
message_size_limit 65536

# ── Connection limits ────────────────────────────────────
max_connections -1
