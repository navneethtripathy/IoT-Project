# Mosquitto MQTT Broker Configuration for CivicTwin-R
#
# Local development configuration for Docker Desktop on macOS.
# For production deployments, enable authentication (password_file),
# TLS certificates, and access-control lists (ACLs).

# ── MQTT TCP listener (port 1883) ────────────────────────────────────
# Binds to all interfaces so containers and the Mac host can connect.
listener 1883 0.0.0.0
protocol mqtt

# ── MQTT WebSocket listener (port 9001) ──────────────────────────────
# Required for browser-based clients (e.g. Wokwi's MQTT-over-WebSocket
# when the broker is exposed via a public relay or ngrok tunnel).
listener 9001 0.0.0.0
protocol websockets

# ── Logging ──────────────────────────────────────────────────────────
log_type error
log_type warning
log_type notice
log_type information

# ── Persistence ──────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Security (local development only) ────────────────────────────────
# WARNING: allow_anonymous true is for local development ONLY.
# For any networked deployment, set this to false and configure
# a password_file or authentication plugin.
allow_anonymous true

# ── Message limits ───────────────────────────────────────────────────
max_packet_size 65536
message_size_limit 65536

# ── Connection limits ─────────────────────────────────────────────────
max_connections -1
